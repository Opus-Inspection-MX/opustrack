project: opustrack
detected: 2026-06-10
artifact_store: hybrid
execution_mode: interactive
delivery_strategy: ask-on-risk

context: |
  OpusTrack — incident management and work order tracking system for Vehicle Inspection Centers (VICs) in Mexico.
  Stack: Next.js 15 (App Router, Turbopack), React 19, TypeScript strict, Prisma 6 + PostgreSQL, NextAuth v4 (JWT).
  Domain: Client (inspection center), Assignment, Incident, FSR, Schedule, Vehicle, Notification, Holiday, Vacation.
  Architecture: database-driven RBAC, JWT+Edge Runtime middleware, Server Components + Server Actions (default pattern).
  Linter/formatter: Biome 2.2. No ESLint/Prettier.
  Spec source of truth: spec/ (00-overview + 01-10), requirements RF-XXX; preserve existing requirement IDs and scenarios.
  Code uses Client/REPORTER; spec/ retains some historical Spanish identifiers. Domain rules override stale terminology in guidance.

stack:
  runtime: Node.js
  framework: next@15.5.9
  language: TypeScript 5 (strict)
  ui: React 19 / Radix UI / shadcn (New York) / Tailwind 4
  orm: Prisma 6 + PostgreSQL
  auth: NextAuth v4 (JWT, 30-day, Edge Runtime)
  forms: react-hook-form + Zod 4
  charts: Recharts
  pdf: @react-pdf/renderer
  excel: exceljs
  storage: Vercel Blob (default) | filesystem
  linter: Biome 2.2
  formatter: Biome 2.2

testing:
  strict_tdd: false
  caveat: >
    Meaningful domain, Server Action and component tests exist in the Vitest unit project.
    Integration and Playwright runners create, migrate and seed an ephemeral PostgreSQL stack,
    then tear it down on completion/failure. They share the fixed E2E compose stack and must not overlap.
    Raw workflow fixtures are prerequisites/cleanup only; tested business transitions use authenticated UI.
    Unit coverage thresholds are configured at 75%; passing coverage is established by execution, not this context.
  unit:
    available: true
    command: npm run test:unit
    runner: vitest@4
    environment: jsdom
    setup: src/test/setup.ts
  e2e:
    available: true
    command: npm run test:e2e
    runner: "@playwright/test@1.57"
    config: playwright.config.ts
    note: "Role workflow isolation is specified in role-workflow-e2e; dedicated invocation/project is pending implementation."
  coverage:
    available: true
    command: npm run test:coverage
    provider: v8
    thresholds: { lines: 75, functions: 75, branches: 75, statements: 75 }
  integration:
    available: true
    command: npm run test:int
    tool: "Vitest integration project + real ephemeral PostgreSQL"
    setup: src/test/integration/setup.ts
    note: "Existing integration tests live in src/test/integration/**/*.int.test.ts; browser tests belong to Playwright."

phases:
  proposal:
    model: opus
    questions_round: true
  spec:
    model: sonnet
  design:
    model: opus
  tasks:
    model: sonnet
    review_workload_guard: true
    budget_lines: 400
  apply:
    model: sonnet
    strict_tdd: false
  verify:
    model: sonnet
  archive:
    model: haiku
