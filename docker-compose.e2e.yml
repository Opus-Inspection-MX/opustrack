# Throwaway PostgreSQL for the end-to-end suite.
#
# Deliberately isolated from development and production:
#   - its own container name and port (5433 by default — 5432 is usually taken),
#   - its data directory is a tmpfs, so every `up` starts from an empty database
#     and nothing survives a `down`.
#
# The credentials below are not secrets: they only ever reach this ephemeral
# container. Real credentials belong in `config/e2e.local.env` (gitignored).
#
# Its own project name: both compose files live in the same directory, so
# without this they would share the default project `opustrack` — one network,
# and a teardown here reaching into the development stack.
name: opustrack-e2e

services:
  e2e-db:
    image: postgres:17-alpine
    container_name: opustrack-e2e-db
    environment:
      POSTGRES_USER: opustrack_e2e
      POSTGRES_PASSWORD: opustrack_e2e
      POSTGRES_DB: opustrack_e2e
    ports:
      - "${E2E_DB_PORT:-5433}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      # `docker compose up --wait` blocks on this, so the migrate step never
      # races the server's startup.
      test: ["CMD-SHELL", "pg_isready -U opustrack_e2e -d opustrack_e2e"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Catches every email the app sends during the suite, so the tests can assert
  # on real delivery instead of on a mock. Nothing leaves the machine.
  mailpit:
    image: axllent/mailpit:latest
    container_name: opustrack-e2e-mailpit
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "${E2E_SMTP_PORT:-1025}:1025"
      - "${E2E_MAILPIT_PORT:-8025}:8025"
    healthcheck:
      # `up --wait` blocks on this, so the app never boots pointing at an SMTP
      # port that is not listening yet.
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 30
