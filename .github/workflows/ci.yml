# Verification on every push: format, types, unit tests and the e2e suite.
#
# The `e2e` job runs the full Playwright suite in Chromium on every PR and on
# `main` (not on branch pushes, where only `verify` runs). First-run duration
# is not measured yet — adjust `timeout-minutes` once it is (placeholder: ~25
# min budget; split into two jobs per project if it exceeds it).
#
# No secrets required. The e2e database is an ephemeral container defined in
# `docker-compose.e2e.yml`, credentials come from the tracked `config/e2e.env`,
# and Mailpit captures every email locally.
#
# Deployment does not live here: the Vercel integration deploys directly on
# push. Branch protection requiring `verify` + `e2e` before merge is a manual
# setup step (see the Fase 1 PR description).
name: CI

on:
  push:
  pull_request:

# Un push nuevo cancela la verificación anterior de la misma rama, para no
# gastar minutos en commits que ya quedaron atrás.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Formato, tipos y unitarias
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` dispara postinstall → prisma generate, necesario para que
      # tsc resuelva los tipos de @prisma/client.
      - name: Instalar dependencias
        run: npm ci

      - name: Biome + TypeScript
        run: npm run check

      - name: Pruebas unitarias
        run: npm run test:unit

  e2e:
    name: E2E (Chromium)
    needs: verify
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Cache de navegadores Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # Keyed by the @playwright/test version: a bump invalidates the
          # browser binaries. package-lock.json pins the exact resolved one.
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Suite e2e
        run: npm run test:e2e

      - name: Subir reporte Playwright
        # Siempre, no solo al fallar: una corrida verde con flaky tampoco
        # deja traza, y con `trace: "on-first-retry"` cada flaky deja la
        # suya para clasificarlo.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  integration:
    name: Integración (Postgres real)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Levanta solo el contenedor e2e-db, migra + siembra y corre el
      # proyecto integration de Vitest. Corre en paralelo con e2e (Fase 1):
      # ambos declaran solo `needs: verify` y cada uno destruye su base al
      # terminar — en CI cada job tiene su propio runner, así que no chocan.
      - name: Pruebas de integración
        run: npm run test:int
