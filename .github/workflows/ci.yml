# Verification on every push and PR: format, types, unused files and unit tests.
# Integration and e2e suites remain available locally through npm scripts;
# GitHub Actions does not run them or provision databases and browsers.
#
# Deployment does not live here: the Vercel integration deploys directly on
# push. Branch protection should require only `verify`, not the removed `e2e`
# or `integration` jobs; required checks are configured in repository settings.
name: CI

on:
  push:
  pull_request:

# Un push nuevo cancela la verificación anterior de la misma rama, para no
# gastar minutos en commits que ya quedaron atrás.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Formato, tipos y unitarias
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # `npm ci` dispara postinstall → prisma generate, necesario para que
      # tsc resuelva los tipos de @prisma/client.
      - name: Instalar dependencias
        run: npm ci

      - name: Biome + TypeScript
        run: npm run check

      - name: Pruebas unitarias
        run: npm run test:unit
